<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Business Bot - SaaS Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e', accent: '#6366f1' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-brand-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">⚡</div>
            <div>
                <h1 class="font-bold text-base leading-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Gemini AI Studio</h1>
                <p class="text-xs text-emerald-400 font-medium flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Монетизация активна</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="switchTab('monetize')" class="flex items-center gap-1.5 bg-gradient-to-r from-amber-500/20 to-yellow-500/20 border border-amber-500/40 text-amber-300 px-3 py-1.5 rounded-full text-xs font-semibold">
                <i class="fa-solid fa-coins text-amber-400"></i> <span id="user-tokens-count">5</span> токенов
            </button>
            <button onclick="switchTab('admin')" class="p-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300"><i class="fa-solid fa-user-shield text-sm"></i></button>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-3 md:p-4 flex flex-col justify-between">
        <section id="tab-chat" class="tab-content flex-1 flex flex-col h-[calc(100vh-140px)]">
            <div id="ad-banner-top" class="mb-3 p-2.5 rounded-xl bg-gradient-to-r from-purple-900/40 to-indigo-900/40 border border-indigo-500/30 flex items-center justify-between text-xs">
                <span class="text-slate-200">💎 Получи доступ к VIP AI со скидкой 50%!</span>
                <button onclick="switchTab('monetize')" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-xs">Купить VIP</button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto chat-scroll space-y-4 pr-1 mb-3">
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-xs font-bold">AI</div>
                    <div class="glass-panel p-3.5 rounded-2xl max-w-[85%] text-sm text-slate-200">
                        <p class="font-semibold text-indigo-400 mb-1">Привет! Я ваш AI-Ассистент 🚀</p>
                        <p>Чем я могу вам помочь сегодня?</p>
                    </div>
                </div>
            </div>
            <div class="space-y-2">
                <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                    <label class="flex items-center gap-1.5"><input type="checkbox" id="mode-image" class="rounded bg-slate-800 border-slate-700 text-indigo-600">🎨 Картинка (5 токенов)</label>
                    <label class="flex items-center gap-1.5"><input type="checkbox" id="mode-tts" class="rounded bg-slate-800 border-slate-700 text-indigo-600">🔊 Озвучка (3 токена)</label>
                </div>
                <div class="relative glass-panel rounded-2xl p-1.5 border border-slate-800">
                    <form id="chat-form" onsubmit="handleChatSubmit(event)" class="flex items-center gap-2">
                        <textarea id="user-input" rows="1" placeholder="Введите сообщение..." class="flex-1 bg-transparent px-3 py-2 text-sm text-slate-100 focus:outline-none resize-none"></textarea>
                        <button type="submit" class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0"><i class="fa-solid fa-paper-plane text-sm"></i></button>
                    </form>
                </div>
            </div>
        </section>

        <section id="tab-presets" class="tab-content hidden space-y-4">
            <h2 class="text-lg font-bold text-white">🔥 Готовые AI-Сервисы</h2>
            <div class="grid grid-cols-1 gap-3">
                <div onclick="activatePreset('SMM', 'Напиши пост')" class="glass-panel p-4 rounded-xl cursor-pointer">📱 SMM-Маркетолог</div>
                <div onclick="activatePreset('Таролог', 'Сделай расклад')" class="glass-panel p-4 rounded-xl cursor-pointer">🔮 Таролог & Гороскопы</div>
            </div>
        </section>

        <section id="tab-monetize" class="tab-content hidden space-y-4">
            <h2 class="text-2xl font-bold text-center text-white">💎 Купить токены</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass-panel p-5 rounded-2xl text-center space-y-3">
                    <h3 class="font-bold">Старт</h3>
                    <div class="text-2xl font-extrabold">199 ₽</div>
                    <button onclick="simulatePayment('Старт', 199, 50)" class="w-full py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">Купить 50 токенов</button>
                </div>
            </div>
        </section>

        <section id="tab-admin" class="tab-content hidden space-y-4">
            <h2 class="text-lg font-bold text-white">⚙️ Панель управления Владельца</h2>
            <div class="glass-panel p-4 rounded-2xl space-y-3">
                <label class="block text-xs text-slate-400">Ваш Gemini API Key:</label>
                <input type="password" id="admin-api-key" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs">
                <button onclick="saveAdminSettings()" class="w-full py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">Сохранить</button>
            </div>
        </section>
    </main>

    <nav class="glass-panel border-t border-slate-800 sticky bottom-0 z-40 px-4 py-2">
        <div class="max-w-md mx-auto flex justify-between items-center text-xs">
            <button onclick="switchTab('chat')" id="nav-chat" class="text-indigo-400 font-semibold"><i class="fa-solid fa-comment-dots text-base"></i><br>Чат</button>
            <button onclick="switchTab('presets')" id="nav-presets" class="text-slate-400"><i class="fa-solid fa-wand-magic-sparkles text-base"></i><br>Сервисы</button>
            <button onclick="switchTab('monetize')" id="nav-monetize" class="text-slate-400"><i class="fa-solid fa-gem text-base"></i><br>Купить</button>
            <button onclick="switchTab('admin')" id="nav-admin" class="text-slate-400"><i class="fa-solid fa-sliders text-base"></i><br>Админка</button>
        </div>
    </nav>

    <script>
        let userTokens = parseInt(localStorage.getItem('user_tokens') || '5');
        let customApiKey = localStorage.getItem('custom_api_key') || '';
        document.getElementById('user-tokens-count').innerText = userTokens;

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            document.getElementById(`tab-${t}`).classList.remove('hidden');
        }

        async function handleChatSubmit(e) {
            if(e) e.preventDefault();
            const input = document.getElementById('user-input');
            const txt = input.value.trim();
            if(!txt) return;
            input.value = '';
            appendMsg('user', txt);
            await processRequest(txt);
        }

        async function processRequest(prompt) {
            if (userTokens < 1) { alert('Недостаточно токенов!'); return; }
            userTokens--;
            localStorage.setItem('user_tokens', userTokens);
            document.getElementById('user-tokens-count').innerText = userTokens;

            const apiKey = customApiKey || "";
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Ошибка генерации";
            appendMsg('assistant', reply);
        }

        function appendMsg(sender, text) {
            const c = document.getElementById('chat-messages');
            const d = document.createElement('div');
            d.className = "flex items-start gap-3";
            d.innerHTML = `<div class="font-bold text-xs">${sender.toUpperCase()}:</div><div>${text}</div>`;
            c.appendChild(d);
        }

        function simulatePayment(plan, price, tokens) {
            userTokens += tokens;
            localStorage.setItem('user_tokens', userTokens);
            document.getElementById('user-tokens-count').innerText = userTokens;
            alert(`Успешно начислено ${tokens} токенов!`);
        }

        function saveAdminSettings() {
            localStorage.setItem('custom_api_key', document.getElementById('admin-api-key').value);
            alert("Настройки сохранены!");
        }
    </script>
</body>
</html>
